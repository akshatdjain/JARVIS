services:
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: yt-cipher
    restart: unless-stopped
    environment:
      - OVERRIDE_PLAYER_VARIANT=IAS
    networks:
      - jarvis_internal

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink
    restart: unless-stopped
    user: root
    env_file:
      - .env
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxGCPauseMillis=50
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./lavalink/plugins:/opt/Lavalink/plugins
      - ./lavalink/cookies.txt:/opt/Lavalink/cookies.txt:ro
    ports:
      - "127.0.0.1:2333:2333"
    networks:
      - jarvis_internal
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 --spider --header=\"Authorization: $${LAVALINK_PASSWORD}\" http://localhost:2333/v4/info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  jarvis:
    build: ./bot
    image: jarvis-bot:latest
    container_name: jarvis
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    volumes:
      - /opt/stacks/discord-bot/lavalink/application.yml:/app/lavalink_config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      lavalink:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; open('/proc/1/status')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  jarvis_internal:
    name: jarvis_internal
    driver: bridge
  db_aksh:
    name: db_aksh
    external: true
